gasEnv = "None"
ingredients = [{ item = "item_iron_powder", count = 1 }, { item = "item_liquid_water", count = 1 }, { item = "item_liquid_xiranite_poly", count = 1 }, { item = "item_xiranite_powder", count = 1 }]
products = [{ item = "item_liquid_xiranite_lowpoly", count = 1 }, { item = "item_xiranite_poly", count = 1 }]

# [平手 feeder] R0+R6 合并 2 反应: 替代 2 台×50W=100W -> 1 台×100W, 省电 0W (0.0%)
