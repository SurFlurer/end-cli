ingredients = [{ item = "item_liquid_sewage", count = 1 }, { item = "item_liquid_water", count = 2 }, { item = "item_plant_grass_powder_2", count = 1 }, { item = "item_xiranite_powder", count = 1 }]
products = [{ item = "item_liquid_plant_grass_2", count = 1 }, { item = "item_liquid_xiranite_lowpoly", count = 1 }, { item = "item_liquid_xiranite_poly", count = 1 }]

# [省电] R2+R6+R7 合并 3 反应: 替代 3 台×50W=150W -> 1 台×100W, 省电 50W (33.3%)
#   池内消化: 污水(item_liquid_sewage), 液化息壤(item_liquid_xiranite)
# 外部输入 :   蓝铁粉末(item_iron_powder)×1, 💧清水(item_liquid_water)×1, 💧壤晶废液(item_liquid_xiranite_poly)×1,   息壤(item_xiranite_powder)×1
# 外部输出 : 💧惰性壤晶废液(item_liquid_xiranite_lowpoly)×1,   壤晶(item_xiranite_poly)×1
